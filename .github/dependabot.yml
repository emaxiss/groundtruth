version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Only propose versions that have been public for a week. A release that
    # is pulled or found malicious usually is within days, and the updater's
    # own installer rejects versions younger than its release-age floor.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint does not support the TypeScript 7 compiler yet, and
      # eslint-config-next's plugins cap their ESLint peer range at 9. Both
      # were tried and break `pnpm lint`. Remove these when upstream catches up.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
  - package-ecosystem: pip
    directory: /evals
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
