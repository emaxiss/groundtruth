name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app (lint, typecheck, unit coverage, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Fails under the thresholds in vitest.config.ts.
      - name: Unit and route tests with coverage
        run: pnpm test:coverage

      - name: Verify grounding block is within budget
        run: pnpm grounding > /dev/null

      - name: Build
        run: pnpm build

      # Built once here; the jobs below run the same artifact.
      - name: Pack the build
        run: tar -czf build.tgz .next

      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: build.tgz
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/lcov.info
          retention-days: 7

  contract:
    name: contract (API over HTTP, fake-LLM)
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: next-build
      - run: tar -xzf build.tgz

      # playwright.config.ts starts the built app in fake mode itself. The
      # contract project uses the request fixture, so no browser is installed.
      - name: Verify the API contract and determinism
        run: pnpm test:contract

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-results
          path: test-results/junit.xml
          retention-days: 7

  e2e:
    name: e2e (Chromium, Firefox, WebKit, mobile; axe)
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit

      - uses: actions/download-artifact@v4
        with:
          name: next-build
      - run: tar -xzf build.tgz

      - name: Run the browser suite
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/junit.xml
          retention-days: 7

  redteam:
    name: redteam (Promptfoo adversarial suite, fake-LLM)
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: next-build
      - run: tar -xzf build.tgz

      # In fake mode this proves the config, the provider wiring, and every
      # assertion still parse and hold; the live run is in live-evals.yml.
      - name: Run the adversarial suite against the app in fake mode
        env:
          GROUNDTRUTH_FAKE_LLM: '1'
          GROUNDTRUTH_APP_URL: http://localhost:3000
        run: |
          pnpm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done
          pnpm redteam --delay 0 -j 4 --no-table

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redteam-results
          path: redteam/results/
          retention-days: 7

  evals:
    name: evals (harness lint, types, coverage; deterministic tier)
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - run: pnpm install --frozen-lockfile
      - run: pip install -r evals/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: next-build
      - run: tar -xzf build.tgz

      - name: Validate the dataset
        run: pnpm evals:validate

      - name: Lint, format-check, and type-check the harness
        run: |
          ruff check evals
          ruff format --check evals
          pnpm evals:typecheck

      # Fails under the floor in evals/pyproject.toml.
      - name: Harness unit tests with coverage
        run: pnpm evals:unit

      - name: Run the deterministic tier against the app in fake mode
        env:
          GROUNDTRUTH_FAKE_LLM: '1'
          GROUNDTRUTH_APP_URL: http://localhost:3000
          DEEPEVAL_TELEMETRY_OPT_OUT: '1'
        run: |
          pnpm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done
          pnpm evals:deterministic --junitxml=evals/results/junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-run-report
          path: evals/results/
          retention-days: 30
