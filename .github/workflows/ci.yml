name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and route tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate eval dataset
        run: pnpm evals:validate

  contract:
    name: contract (fake-LLM determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # No API key, no model: fake mode makes the API contract testable in CI.
      - name: Verify grounding block is within budget
        run: pnpm grounding > /dev/null

      - name: Verify API contract and determinism
        env:
          GROUNDTRUTH_FAKE_LLM: '1'
        run: |
          pnpm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done
          pnpm verify:contract

  evals:
    name: evals (deterministic tier, fake-LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pip install -r evals/requirements.txt

      - name: Run the deterministic tier against the app in fake mode
        env:
          GROUNDTRUTH_FAKE_LLM: '1'
          GROUNDTRUTH_APP_URL: http://localhost:3000
        run: |
          pnpm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done
          pnpm evals:deterministic
