[tool.pytest.ini_options]
testpaths = ["suites", "tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "judge: scored by an LLM judge; noisier and needs a model, excluded from the CI gate with -m 'not judge'",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["harness"]

[tool.ruff.lint.per-file-ignores]
# Rubric text and verbatim model phrasings are kept on one line each.
"harness/judge.py" = ["E501"]
"tests/test_decline_pattern.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
files = ["harness", "tools", "conftest.py"]
strict = true
warn_unreachable = true
# DeepEval ships without complete type information.
[[tool.mypy.overrides]]
module = ["deepeval.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
source = ["harness"]
# The judge suite needs a live model; its module is covered by mocked-transport tests.
omit = ["harness/reporting.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
