      <path d="M708 280H1114" stroke="#24312f" stroke-dasharray="3 4"/>
      <text x="708" y="306" fill="#9bb0aa">new failures: <tspan fill="#f2545b" font-weight="700">edge-002, multi-002</tspan></text>
