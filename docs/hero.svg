    <text x="92" y="83" font-size="21" font-weight="600" fill="#4ade9b" letter-spacing="1">groundtruth</text>

    <!-- headline -->
    <text font-size="38" font-weight="700" fill="#dfe7e4" letter-spacing="-0.5">
      <tspan x="62" y="150">An AI support agent,</tspan>
      <tspan x="62" y="198">and the harness that</tspan>
      <tspan x="62" y="246" fill="#4ade9b">proves it works.</tspan>
    </text>

    <!-- stat tiles -->
    <g font-size="12" fill="#9bb0aa">
