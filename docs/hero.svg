      <text x="78" y="317" font-size="24" font-weight="700" fill="#dfe7e4">36</text>
      <text x="78" y="339">golden cases</text>

      <rect x="210" y="286" width="138" height="66" rx="10" fill="#111716" stroke="#24312f"/>
      <text x="226" y="317" font-size="24" font-weight="700" fill="#dfe7e4">24</text>
      <text x="226" y="339">red-team attacks</text>

      <rect x="358" y="286" width="138" height="66" rx="10" fill="#111716" stroke="#24312f"/>
      <text x="374" y="317" font-size="24" font-weight="700" fill="#dfe7e4">16/16</text>
      <text x="374" y="339">judge agreement</text>

      <rect x="506" y="286" width="138" height="66" rx="10" fill="#111716" stroke="#24312f"/>
      <text x="522" y="317" font-size="24" font-weight="700" fill="#dfe7e4">4</text>
      <text x="522" y="339">browsers + axe</text>
    </g>

