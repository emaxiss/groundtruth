<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">groundtruth</title>
  <desc id="d">An AI support agent and the harness that proves it works. A run report shows two new failures, edge-002 and multi-002, after a one-line edit to the refund window.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#24312f" stroke-width="1" opacity="0.45"/>
    </pattern>
    <radialGradient id="glow" cx="0.18" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#4ade9b" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#4ade9b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.45" stop-color="#0b0f0e" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0f0e" stop-opacity="0.6"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="400" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
